<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Tracker</title>
</head>
<body>

    <h1>To-Do List Tracker</h1>

    <br>

    <div>
        <input type="text" id="taskInput" placeholder="Enter a new task...">
        <button id="addTaskBttn">Add Task</button>
    </div>

    <br>

    <section id="to-do">
    <h2>To-Do:</h2>
    <ul id="todo-list"></ul>
    </section>

    <br>

    <section id="done">
    <h2>Done!:</h2>
    <ul id="done-list"></ul>
    </section>

    <br>

    <section id="discarded">
    <h2>Discarded:</h2>
    <ul id="discarded-list"></ul>
    </section>

    <br>

    <script src="script.js"></script>
    
</body>
</html>
