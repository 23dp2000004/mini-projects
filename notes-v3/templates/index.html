<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
</head>
<body>

    <h1>My Notes</h1>

    <!-- Form to add a note -->
    <form method="POST">
        <input type="text" name="content" placeholder="Enter note">
        <button type="submit">Add Note</button>
    </form>

    <hr>

    <!-- Display notes -->
    {% for note in notes %}
        <p>{{ note.content }} <a href="/delete/{{ note.id }}">Delete</a> </p>
    {% endfor %}

    
</body>
</html>
