<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roll Simulator</title>
</head>
<body>
    <h1>Dice Roll Simulator</h1>

    <br>

    <label>Choose a dice to roll:</label>
    <select id="chooseDice">
        <option value="d6single">D6 single</option>
        <option value="d6double">D6 double</option>
        <option value="d20single">D20 single</option>
    </select>

    <p>You got: <span id="result">---</span></p>

    <br>

    <button id="rollBttn">ROLL</button>

    <script src="script.js"></script>
    
</body>
</html>
